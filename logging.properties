# Root logger level — applies to everything unless overridden below
.level = INFO

# Where log records go
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Console: show everything the loggers let through
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# File: same, so application FINE records reach the file too
java.util.logging.FileHandler.pattern = app-%u.log
java.util.logging.FileHandler.limit = 10000000
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Output format (java.util.Formatter syntax, arguments are positional):
#   %1$ — java.util.Date       record timestamp
#   %2$ — String               source class and method (needs stack walk, slow)
#   %3$ — String               logger name
#   %4$ — String               level (INFO, FINE, SEVERE, ...)
#   %5$ — String               the message itself
#   %6$ — String               throwable, or empty string if none
#
# Pieces used below:
#   %1$tF        date as 2026-09-28        (t = date/time conversion, F = ISO date)
#   %1$tT        time as 14:23:15          (T = 24-hour clock)
#   %1$tL        milliseconds as 412       (L = millis, prefixed with a dot here)
#   %4$-7s       level, left-aligned to 7 chars so messages line up
#   [%3$s]       logger name in brackets
#   %5$s         message
#   %6$s         stack trace, empty when the record carries no exception
#   %n           platform line separator
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n

# Application packages — more detail than the rest
org.example.StudentRegistry.level = FINE